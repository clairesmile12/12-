<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小野不在家 · Sewing Letter Studio</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fbf2f0;color:#523b49;font-family:Georgia,"Microsoft YaHei",serif}header{padding:20px 5%;background:#fffaf7;border-bottom:1px solid #edd8dd;display:flex;justify-content:space-between;align-items:center}.logo{font-weight:700;letter-spacing:2px}main{max-width:1200px;margin:auto;padding:35px 20px}h1{text-align:center;font-size:clamp(28px,4vw,54px);font-weight:400;margin:0}p{text-align:center;color:#947785}.layout{display:grid;grid-template-columns:300px 1fr;gap:22px;margin-top:28px}.panel,.art{background:#fffaf8;border:1px solid #e7d6d4;border-radius:18px;padding:22px;box-shadow:0 12px 40px #6138460a}label{display:block;margin:14px 0 7px}textarea{width:100%;min-height:120px;border:1px solid #decbd2;border-radius:12px;padding:12px;font-size:17px;background:white}input[type=range]{width:100%}button{background:#ae718e;color:white;border:0;border-radius:30px;padding:12px 18px;cursor:pointer;width:100%;margin-top:15px;font-size:15px}.stage{background:#242028;border-radius:15px;min-height:370px;overflow:auto;display:grid;place-items:center;padding:15px}.stage canvas{max-width:100%;height:auto}small{color:#9a7b8a;line-height:1.6;display:block;margin-top:16px}.note{font-size:12px}@media(max-width:760px){.layout{grid-template-columns:1fr}}
</style></head><body><header><div class="logo">小野不在家 <span>✿</span></div><div>SEWING LETTER STUDIO</div></header><main><h1>Little Atelier · 缝纫字母工坊</h1><p>韩式甜美 × 法式复古 · 输入文字制作你的布艺字卡</p><div class="layout"><section class="panel"><label for="txt">输入中文 / English / 123</label><textarea id="txt">小野不在家 LOVE 2026</textarea><label>字形大小 <output id="sizeOut">95</output></label><input id="size" type="range" min="45" max="140" value="95"><label>间距 <output id="gapOut">9</output></label><input id="gap" type="range" min="0" max="32" value="9"><label>背景</label><select id="bg"><option value="#242028">午夜黑</option><option value="#fff8f3">奶油白</option><option value="#edd4e1">樱花粉</option></select><button id="dl">下载 PNG 图片</button><small>当前是可在线使用的布艺效果演示版。它不是参考图里的逐字真实手工照片；参考图中的英文图片素材尚未上传到本仓库，因此不能声称已达到完全一致的立体效果。</small></section><section class="art"><div class="stage"><canvas id="canvas" width="1200" height="650"></canvas></div><p class="note">输入文字会即时更新 · 下载高分辨率 PNG</p></section></div></main>
<script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');const tx=document.querySelector('#txt'),sz=document.querySelector('#size'),gp=document.querySelector('#gap'),bg=document.querySelector('#bg');let rend=()=>{document.querySelector('#sizeOut').textContent=sz.value;document.querySelector('#gapOut').textContent=gp.value;ctx.fillStyle=bg.value;ctx.fillRect(0,0,canvas.width,canvas.height);let font=+sz.value,spacing=+gp.value,x=55,y=font+65;const chars=Array.from(tx.value||' ');ctx.textBaseline='alphabetic';ctx.lineJoin='round';let i=0;for(const ch of chars){if(ch==='\n'){x=55;y+=font*1.7;continue;}ctx.font='900 '+font+'px Georgia,"Microsoft YaHei",sans-serif';let w=ctx.measureText(ch).width;if(x+w>canvas.width-55){x=55;y+=font*1.7;}const mint=i%3===1,pink=i%3===0;color=mint?'#a8d5c9':pink?'#e1a5b9':'#f0d9ba';ctx.save();ctx.shadowColor='#100c11';ctx.shadowBlur=12;ctx.shadowOffsetY=13;ctx.lineWidth=12;ctx.strokeStyle='#5b3c4e';ctx.strokeText(ch,x,y);ctx.shadowColor='transparent';ctx.lineWidth=8;ctx.strokeStyle='#f6e8dc';ctx.strokeText(ch,x,y);ctx.fillStyle=color;ctx.fillText(ch,x,y);ctx.setLineDash([3,5]);ctx.lineWidth=2;ctx.strokeStyle='#fff9ea';ctx.strokeText(ch,x,y);ctx.setLineDash([]);ctx.restore();if(ch.trim()){let cx=x+w*.72,cy=y-font*.83;ctx.beginPath();ctx.arc(cx,cy,Math.max(3,font*.055),0,Math.PI*2);ctx.fillStyle='#fff9ec';ctx.shadowColor='#8b5766';ctx.shadowBlur=5;ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#e1bed0';ctx.lineWidth=2;ctx.stroke();}x+=w+spacing;i++;if(y>canvas.height-60)break;}};[tx,sz,gp,bg].forEach(el=>el.addEventListener('input',rend));document.querySelector('#dl').onclick=()=>{rend();const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='小野不在家-sewing-letter.png';a.click()};rend();
</script></body></html>
